# Required PR checks — docs/ci-plan.md §2.3 (Tier C).
#
# Target: under 10 minutes of wall time, with EVERY security check on every run:
#   checks       static gates, typecheck of affected workspaces and always of both apps, the whole web suite,
#                small workspaces
#   api (1..4)   the WHOLE API suite in four shards, business profiles OFF then ON (the count lives in the matrix)
#   postgres (1..2)  real PostgreSQL 17: the real-PG race suites in two parts, split by measured time;
#                runtime-role isolation, RBAC deny-by-default coverage, database package tests and the
#                migration upgrade check run once, in part 1
#   smoke (1..2) Playwright @smoke against `next start` + the API in production mode on a restricted
#                database login, seeded disposable database, production hosts fenced off
#   sheet (1..3) the product-sheet commit sweep (@sheet): every editable column of every scope the seed
#                builds, committed by keyboard, mouse and paste, on the same kind of stack as smoke
#   db-security  one profiles-ON report per API shard, the profiles-ON ratchet over them, and every real-PG
#                suite passed in exactly one PostgreSQL part (fixed name, so a branch rule can require it)
#   ci-ok        one required status for the whole run
#
# Sheet runs for web/API/shared/DB and build dependencies; release/manual runs always include it.
# Both apps are always type-checked. Other workspaces (turbo --affected) and the small-workspace tests use change selection.
# Selecting "security" tests by file name misses real ones, so the API suite always runs whole.

name: CI

# No `push: main` trigger: Deploy API calls this workflow (`verify`) on the exact release commit, and
# the nightly workflow runs it on main (docs/ci-plan.md §2.4–2.5). Two copies per push were waste.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# A newer push to the same PR cancels the older run. Runs on main are never cancelled: each commit
# keeps its own verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXUS_DISABLE_BACKGROUND_JOBS: '1'
  ENABLE_QUEUE_WORKERS: '0'

jobs:
  sheet-changes:
    name: Sheet dependency paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node apps/web/smoke/sheet/ci-policy.mjs paths >> "$GITHUB_OUTPUT"

  checks:
    name: Static gates, typecheck, web and workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: Base commit
        run: node scripts/ci/base-commit.mjs >> "$GITHUB_ENV"
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}

      - name: Static gates (all ~50, every failure reported)
        run: node scripts/ci/run-static-gates.mjs

      - name: Typecheck affected workspaces
        run: npx turbo run typecheck --affected --cache=local:rw -- --incremental false

      - name: Typecheck both apps (always — each one compiles files of the other)
        # On 2026-09-30 a review found that `--affected` picks a workspace only by the files changed inside its own
        # folder or its declared dependencies, while each app type-checks files of the other, which it does not declare:
        # @nexus/api compiles apps/web/src's presence.ts, registry.ts and tone.ts; @nexus/web compiles
        # apps/api/src/lib/listing-coordinate.ts and docs/fixtures/vt1/fixtures.ts. A change to only those files did not
        # type-check the app importing them, a change to fixtures.ts alone type-checked no workspace at all, and Deploy
        # API's `verify` runs this job before every release. So both apps are type-checked on every run. A task the step
        # above already ran replays from the local cache: turbo.json puts those outside files into its key.
        run: npx turbo run typecheck --filter=@nexus/api --filter=@nexus/web --cache=local:rw -- --incremental false

      - name: Web tests (whole suite — proxy, workspace paths and permission gates included)
        env:
          # The operators' zone and the developer machines'. Some date tests assert a Rome-local day
          # (adsScope 'dates are read from LOCAL parts'); on a UTC runner their control cannot hold.
          TZ: Europe/Rome
        run: npm run test --workspace=@nexus/web

      - name: Sheet smoke drivers and seed types
        run: npx tsc --noEmit -p apps/web/smoke/sheet/tsconfig.json

      - name: Factory, shared and events tests (affected)
        run: npx turbo run test --affected --filter=@nexus/factory --filter=@nexus/shared --filter=@nexus/events

  # Four shards since 2026-09-30 (three before). In 15 runs of 2026-09-29 a shard took 6–11 min and the
  # PostgreSQL job 7–12.6 min: verify was the long pole of every deploy (docs/ci-fast-deploys/PLAN-2026-09-29.md,
  # D1). The split is the same file list, every file once (scripts/ci/api-test-plan.mjs).
  # The shard count is written once, as the matrix: SHARD and the report's name take it from strategy.job-total,
  # and db-security reads it back from the reports' names (1..m of m, each once). A shard that never reported
  # fails there (review of fast-deploys step 6, 2026-09-30).
  api:
    name: API tests (${{ matrix.shard }}/${{ strategy.job-total }}, profiles OFF + ON)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nexus_test
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/nexus_test
      SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Disposable database (bootstrap + market catalogue; durability off)
        run: |
          psql postgresql://postgres@127.0.0.1:5432/postgres -qc "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
          npx tsx scripts/ci/prepare-test-database.mts --url "$DATABASE_URL"

      - name: Profiles OFF
        env:
          REDIS_URL: redis://127.0.0.1:6379
          NEXUS_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          node scripts/ci/api-test-plan.mjs --shard "$SHARD" --run -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/off.json"
          node scripts/ci/api-test-plan.mjs --check-skips "$RUNNER_TEMP/off.json"

      - name: Profiles ON (judged by the ratchet in db-security)
        env:
          NEXUS_WORKSPACES_ENABLED: '1'
          # Same as the ratchet's own run: a dead Redis port, so no test reaches a real queue.
          REDIS_URL: redis://127.0.0.1:1
        run: |
          set +e
          node scripts/ci/api-test-plan.mjs --shard "$SHARD" --run -- --reporter=dot --reporter=json --outputFile.json="$RUNNER_TEMP/on.json"
          echo "profiles-ON pass exited $? — known failures are judged against profiles-on-baseline.ci.json"
          set -e
          test -s "$RUNNER_TEMP/on.json" || { echo "✗ no profiles-ON report — could not measure"; exit 1; }
          node scripts/ci/api-test-plan.mjs --check-skips "$RUNNER_TEMP/on.json"

      - uses: actions/upload-artifact@v4
        with:
          # profiles-on-<n>-of-<m>: db-security derives the shard count from these names.
          name: profiles-on-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: ${{ runner.temp }}/on.json
          if-no-files-found: error
          # A re-run of a leg that already uploaded must not fail on its own name; each name has one writer.
          overwrite: true
          retention-days: 7

  # Two parts since 2026-09-30 (one job before). In 15 runs of 2026-09-29 the real-PG suites alone took a median
  # 10.5 min of this job's 12.4 min, and the job was verify's longest in 14 of them. Each part runs its share of the
  # suites, split by measured time (scripts/run-real-postgres-tests.mjs --part; it refuses a split that loses or
  # repeats a suite). The steps that run once (RBAC, the migration upgrade check, the database package) stay on
  # part 1, and the split gives part 1 a head start for their ~32 s (PART_ONE_HEAD_START in the runner), so both
  # parts end together.
  # Part 2 uses the service container only for its image: the runner starts its own server and never pulls one.
  # The part count is the matrix's size (strategy.job-total); no command or check repeats it, so a matrix cut to
  # [1] runs every suite in part 1/1, not half of them. Each part records the suites it passed, and db-security
  # checks that together they passed every suite once (review of fast-deploys step 6, 2026-09-30).
  postgres:
    # Part 1 also runs the one-off steps (RBAC coverage, the migration upgrade check, the database package).
    name: PostgreSQL 17 — ${{ matrix.part == 1 && 'isolation, races, RBAC, migrations' || 'isolation, races' }} (${{ matrix.part }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nexus_test
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/nexus_test
      NEXUS_TEST_LOCAL_PG_URL: postgresql://postgres@127.0.0.1:5432/nexus_test
      REDIS_URL: redis://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: Base commit
        if: matrix.part == 1
        run: node scripts/ci/base-commit.mjs >> "$GITHUB_ENV"
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
      - name: Durability off; image for the runtime-role test
        if: matrix.part == 1
        run: |
          psql postgresql://postgres@127.0.0.1:5432/postgres -qc "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
          docker pull -q postgres:17-alpine

      - name: RBAC deny-by-default coverage
        if: matrix.part == 1
        run: npx tsx apps/api/src/scripts/check-rbac-coverage.ts

      - name: Migrations — the PR's, applied as production applies them, equal a fresh database
        if: matrix.part == 1
        run: node scripts/ci/check-migration-upgrade.mjs --server postgresql://postgres@127.0.0.1:5432

      - name: Database package — baseline, applied-but-missing and the other database scripts
        if: matrix.part == 1
        run: npm run test --workspace=@nexus/database

      - name: Real multi-connection PostgreSQL suites (races, doors, restricted logins), part ${{ matrix.part }} of ${{ strategy.job-total }}
        run: node scripts/run-real-postgres-tests.mjs --required --part ${{ matrix.part }}/${{ strategy.job-total }} --record "$RUNNER_TEMP/real-pg-part.tsv"

      - uses: actions/upload-artifact@v4
        with:
          name: real-pg-part-${{ matrix.part }}
          path: ${{ runner.temp }}/real-pg-part.tsv
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  smoke:
    name: Smoke (${{ matrix.shard }}/2) — production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nexus_smoke_test
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/nexus_smoke_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Fence production off (the web app falls back to the production API when a variable is missing)
        run: |
          echo "0.0.0.0 nexusapi-production-b7bb.up.railway.app api.xavia.it app.xavia.it" | sudo tee -a /etc/hosts
          echo "SMOKE_SEED=$RUNNER_TEMP/smoke.json" >> "$GITHUB_ENV"

      - name: Database, seed and restricted app login
        run: |
          psql postgresql://postgres@127.0.0.1:5432/postgres -qc "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
          npx tsx scripts/ci/prepare-test-database.mts --url "$ADMIN_DATABASE_URL"
          npx tsx scripts/ci/seed-smoke.mts --url "$ADMIN_DATABASE_URL" --out "$SMOKE_SEED"
          node -e 'const s = require(process.env.SMOKE_SEED); console.log("::add-mask::" + new URL(s.appDatabaseUrl).password); console.log("::add-mask::" + s.password)'

      - name: Start the API (NODE_ENV=production, restricted login, profiles ON, RBAC enforced)
        run: |
          APP_DATABASE_URL=$(node -p 'require(process.env.SMOKE_SEED).appDatabaseUrl')
          cd apps/api
          NODE_ENV=production PORT=8080 NEXUS_API_HOST=127.0.0.1 DATABASE_URL="$APP_DATABASE_URL" DIRECT_DATABASE_URL="$APP_DATABASE_URL" \
          REDIS_URL=redis://127.0.0.1:6379 NEXUS_WORKSPACES_ENABLED=1 NEXUS_RBAC_MODE=enforce NEXUS_AMAZON_ENV_TOKEN=off \
            nohup node --import tsx src/index.ts > "$RUNNER_TEMP/api.log" 2>&1 &

      - name: Build the web app (production; type step skipped — the checks job type-checks)
        # `next build` directly, not `npm run build`: its prebuild re-runs tsc on @nexus/shared, which
        # rewrote packages/shared/dist while the API (started above) was importing it — measured on #8:
        # "does not provide an export named 'informationRestriction'". The setup step built shared already.
        working-directory: apps/web
        env:
          NEXT_PUBLIC_WORKSPACES_ENABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXUS_CI_SKIP_BUILD_TYPECHECK: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npx next build

      - name: Start the web app (next start)
        run: |
          APP_DATABASE_URL=$(node -p 'require(process.env.SMOKE_SEED).appDatabaseUrl')
          for _ in $(seq 1 90); do curl -sf http://127.0.0.1:8080/api/health/ready >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/health/ready || { echo "✗ API did not become ready"; tail -50 "$RUNNER_TEMP/api.log"; exit 1; }
          cd apps/web
          NODE_ENV=production DATABASE_URL="$APP_DATABASE_URL" NEXUS_API_PROXY_TARGET=http://127.0.0.1:8080 NEXT_TELEMETRY_DISABLED=1 \
            nohup npx next start -p 3000 -H localhost > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000/login || { echo "✗ web did not start"; tail -50 "$RUNNER_TEMP/web.log"; exit 1; }

      # Keyed by the Playwright version: it alone decides which browser build `playwright install` fetches. Keyed by
      # package-lock.json, each PR whose lockfile differed from main's stored its own 271 MB copy (11 copies, 3 GB of the
      # full 10 GB cache, 2026-09-30). The version is read from what is installed, so a Playwright bump always gets its
      # own browser.
      - name: Playwright version (browser cache key)
        id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('@playwright/test/package.json').version")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Playwright browser
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'

      - name: '@smoke journeys'
        working-directory: apps/web
        env:
          SMOKE_BASE_URL: http://localhost:3000
          SMOKE_STORAGE_STATE: ${{ runner.temp }}/smoke-state.json
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/smoke-results
          SMOKE_REPORT_DIR: ${{ runner.temp }}/smoke-report
        run: npx playwright test -c smoke/playwright.config.ts --shard=${{ matrix.shard }}/2

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/smoke-report
            ${{ runner.temp }}/smoke-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          retention-days: 7

  # P3 guardrail 1 (2026-09-30) — apps/web/smoke/sheet/editors.spec.ts. The 2026-09-29 sheet defects (Enter and Tab
  # kept the old value, the chevron did nothing, the first typed key was lost) lived between the key and the wire, where
  # no CI job looked: the smoke seed has no family, listing or channel schema, so nothing ever opened a channel sheet.
  #
  # It CANNOT touch production, by construction and by check:
  #   · the only database is this job's service container on loopback; prepare-test-database, seed-smoke and
  #     seed-sheet-fixture each refuse any database that is not loopback with "test" in its name;
  #   · no production credential reaches this job (the workflow's only secret is the Turbo cache token), and the
  #     production API and web hosts resolve to 0.0.0.0 (the fence below), so a web app that fell back to production
  #     could reach nothing;
  #   · the API runs on the restricted app login of that container; the web is built against localhost and proxies to it;
  #   · the sweep refuses a base URL that is not localhost, and refuses to start until the sheet seed's random NONCE comes
  #     back through the UI (only this run's database holds it); every request a test page makes must stay on loopback;
  #   · the seeded channel connections carry no credentials and every listing is an unpublished DRAFT with no external
  #     id; the one channel read that needs the network (eBay business policies) is answered by the sweep itself.
  # Steps are the smoke job's, plus the sheet seed; keep the two in step.
  sheet:
    needs: [sheet-changes]
    if: needs.sheet-changes.outputs.run == 'true'
    name: Sheet commit sweep (${{ matrix.shard }}/3) — production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nexus_sheet_test
        ports: ['5432:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/nexus_sheet_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Fence production off (the web app falls back to the production API when a variable is missing)
        run: |
          echo "0.0.0.0 nexusapi-production-b7bb.up.railway.app api.xavia.it app.xavia.it" | sudo tee -a /etc/hosts
          echo "SMOKE_SEED=$RUNNER_TEMP/smoke.json" >> "$GITHUB_ENV"
          echo "SHEET_SEED=$RUNNER_TEMP/sheet.json" >> "$GITHUB_ENV"

      - name: Database, seeds (owner + sheet fixture) and restricted app login
        run: |
          psql postgresql://postgres@127.0.0.1:5432/postgres -qc "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
          npx tsx scripts/ci/prepare-test-database.mts --url "$ADMIN_DATABASE_URL"
          npx tsx scripts/ci/seed-smoke.mts --url "$ADMIN_DATABASE_URL" --out "$SMOKE_SEED"
          npx tsx scripts/ci/seed-sheet-fixture.mts --url "$ADMIN_DATABASE_URL" --out "$SHEET_SEED"
          node -e 'const s = require(process.env.SMOKE_SEED); console.log("::add-mask::" + new URL(s.appDatabaseUrl).password); console.log("::add-mask::" + s.password)'

      - name: Start the API (NODE_ENV=production, restricted login, profiles ON, RBAC enforced)
        run: |
          APP_DATABASE_URL=$(node -p 'require(process.env.SMOKE_SEED).appDatabaseUrl')
          cd apps/api
          NODE_ENV=production PORT=8080 NEXUS_API_HOST=127.0.0.1 DATABASE_URL="$APP_DATABASE_URL" DIRECT_DATABASE_URL="$APP_DATABASE_URL" \
          REDIS_URL=redis://127.0.0.1:6379 NEXUS_WORKSPACES_ENABLED=1 NEXUS_RBAC_MODE=enforce NEXUS_AMAZON_ENV_TOKEN=off \
            nohup node --import tsx src/index.ts > "$RUNNER_TEMP/api.log" 2>&1 &

      - name: Build the web app (production; type step skipped — the checks job type-checks)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_WORKSPACES_ENABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXUS_CI_SKIP_BUILD_TYPECHECK: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npx next build

      - name: Start the web app (next start)
        run: |
          APP_DATABASE_URL=$(node -p 'require(process.env.SMOKE_SEED).appDatabaseUrl')
          for _ in $(seq 1 90); do curl -sf http://127.0.0.1:8080/api/health/ready >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/health/ready || { echo "✗ API did not become ready"; tail -50 "$RUNNER_TEMP/api.log"; exit 1; }
          cd apps/web
          NODE_ENV=production DATABASE_URL="$APP_DATABASE_URL" NEXUS_API_PROXY_TARGET=http://127.0.0.1:8080 NEXT_TELEMETRY_DISABLED=1 \
            nohup npx next start -p 3000 -H localhost > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000/login || { echo "✗ web did not start"; tail -50 "$RUNNER_TEMP/web.log"; exit 1; }

      - name: Playwright browser
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'

      - name: '@sheet commit sweep'
        id: sheet-sweep
        working-directory: apps/web
        env:
          SMOKE_BASE_URL: http://localhost:3000
          SHEET_STORAGE_STATE: ${{ runner.temp }}/sheet-state.json
          SHEET_WORKERS: '1'
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/sheet-results
          SMOKE_REPORT_DIR: ${{ runner.temp }}/sheet-report
        run: npx playwright test -c smoke/sheet.config.ts --shard=${{ matrix.shard }}/3

      - name: Authenticated GET and bulk SQL budgets
        # A browser failure must not hide SQL evidence. Both steps still make this required job fail.
        if: (success() || failure()) && steps.sheet-sweep.outcome != 'skipped'
        run: |
          APP_DATABASE_URL=$(node -p 'require(process.env.SMOKE_SEED).appDatabaseUrl')
          cd apps/api
          NODE_ENV=production DATABASE_URL="$APP_DATABASE_URL" DIRECT_DATABASE_URL="$APP_DATABASE_URL" \
          REDIS_URL=redis://127.0.0.1:6379 NEXUS_WORKSPACES_ENABLED=1 NEXUS_RBAC_MODE=enforce \
            npx tsx ../web/smoke/sheet/sql-budget.mts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sheet-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/sheet-report
            ${{ runner.temp }}/sheet-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          retention-days: 7

  db-security:
    name: db-security
    needs: [api, postgres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A matrix job's result is success only when every leg succeeded: every API shard, every PostgreSQL part.
      - name: All API shards and every PostgreSQL part must have passed
        run: |
          echo "api (every shard): ${{ needs.api.result }} · postgres (every part): ${{ needs.postgres.result }}"
          test "${{ needs.api.result }}" = success && test "${{ needs.postgres.result }}" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: profiles-on-*
          path: ${{ runner.temp }}/on
      # The expected count comes from the reports: every name says n-of-m, all m must agree, and n must run 1..m
      # with no gap and no repeat. A literal count here could drift from the matrix and stay green.
      - name: One profiles-ON report per API shard
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/on" 2>/dev/null || { echo "✗ no profiles-ON report was downloaded — could not measure"; exit 1; }
          got=$(find . -mindepth 1 -maxdepth 1 | sed 's|^\./||' | sort)
          m=$(echo "$got" | sed -nE 's/^profiles-on-[0-9]+-of-([0-9]+)$/\1/p' | sort -u)
          [ "$(echo "$m" | grep -c .)" = 1 ] || { echo "✗ the reports do not name one shard count (profiles-on-<n>-of-<m>):"; echo "$got"; exit 1; }
          want=$(seq 1 "$m" | sed "s/.*/profiles-on-&-of-$m/" | sort)
          if [ "$got" != "$want" ]; then
            echo "✗ expected one report per shard, 1..$m of $m (< missing, > not expected):"
            diff <(echo "$want") <(echo "$got") || true
            exit 1
          fi
          for d in $want; do test -s "$d/on.json" || { echo "✗ $d holds no on.json — could not measure"; exit 1; }; done
          # The ratchet reads every on.json below here, so one more anywhere would count a shard twice.
          [ "$(find . -name on.json | grep -c .)" = "$m" ] || { echo "✗ more than one on.json per shard:"; find . -name on.json; exit 1; }
          echo "✓ $m profiles-ON reports: shards 1..$m of $m, each once"
      - name: Profiles-ON ratchet over every shard
        run: |
          reports=$(find "$RUNNER_TEMP/on" -name on.json | sort | paste -sd, -)
          node apps/api/scripts/profiles-on-ratchet.mjs --report="$reports" --baseline=apps/api/scripts/profiles-on-baseline.ci.json
      - uses: actions/download-artifact@v4
        with:
          pattern: real-pg-part-*
          path: ${{ runner.temp }}/real-pg
      # The API side counts one report per shard; this is the same guard for the PostgreSQL parts. A green postgres
      # result alone does not show that every part was scheduled (review of fast-deploys step 6, 2026-09-30).
      - name: Every real-PostgreSQL suite passed in exactly one part
        run: |
          set -euo pipefail
          all="$RUNNER_TEMP/real-pg-all.tsv"
          passed="$RUNNER_TEMP/real-pg-passed.tsv"
          node scripts/run-real-postgres-tests.mjs --list | sort > "$all"
          test -s "$all" || { echo "✗ the real-PG suite list is empty — could not measure"; exit 1; }
          test -d "$RUNNER_TEMP/real-pg" || { echo "✗ no PostgreSQL part recorded its suites"; exit 1; }
          find "$RUNNER_TEMP/real-pg" -name real-pg-part.tsv -exec cat {} + | sort > "$passed"
          if ! diff "$all" "$passed"; then
            echo "✗ the PostgreSQL parts did not pass every real-PG suite exactly once (< never passed, > passed twice or not listed)"
            exit 1
          fi
          echo "✓ the PostgreSQL parts passed all $(grep -c . "$all") real-PG suites, each once"

  ci-ok:
    name: ci-ok
    needs: [checks, api, postgres, smoke, sheet-changes, sheet, db-security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every required job passed (sheet may be intentionally skipped)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node apps/web/smoke/sheet/ci-policy.mjs result
