# Deploy to Railway from GitHub Actions: the API first, then the worker, scheduler and web.
#
# Railway's native GitHub integration is unreliable on this project
# (it stops auto-deploying after rebases or after the worker crashes
# on a Redis hiccup). This workflow takes over. A push to main that
# changes a service's files runs the whole CI on that exact commit (`verify`)
# and builds both Docker images beside it (`images`, images.yml). When the
# API ships, it also asks eBay about the consent scopes (`ebay`). Only then
# does anything ship; every service needs this commit's images.
# The API applies migrations in Railway's pre-deploy step, and Railway waits
# for /api/health/ready before switching traffic.
#
# Each service ships only when its own files differ from the commit it runs now (job `changes`,
# scripts/ci/release-changes.sh). CI-only and docs-only changes deploy nothing (the Owner, 2026-09-30): the paths
# below leave out .github/, scripts/, docs/ (except the one fixture the web imports) and every Markdown file. A hand
# run compares the same way; `gh workflow run deploy-api.yml -f ship=all` ships every service.
#
# Every service ships by image (docs/ci-fast-deploys/PLAN-2026-09-29.md §2): Railway runs
# ghcr.io/<owner>/nexus-api:<sha> (api, worker, scheduler) or nexus-web:<sha> and builds nothing
# (scripts/ci/railway-deploy-image.sh). To go back to an earlier commit: rollback.yml.
#
# Required secrets (set under repo Settings → Secrets and variables
# → Actions):
#   RAILWAY_TOKEN  — Project-scoped token from railway.app/account/
#                    tokens. Scope to the Nexus project so this
#                    workflow can't push to other Railway projects.
#   RAILWAY_SERVICE, RAILWAY_WORKER_SERVICE, RAILWAY_SCHEDULER_SERVICE
#                  — the three distinct service IDs of the API code.
#
# The web app (apps/web) ships from here too, since 2026-09-29 (it left Vercel): job `deploy-web` (after the API
# serves the same commit, when the API ships too), then `smoke-web`. It needs the secret RAILWAY_WEB_SERVICE (the
# `nexus-web` service ID) and the repository variable NEXUS_WEB_URL (its public address).

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/database/**'
      - 'packages/shared/**'
      - 'packages/events/**'
      - 'package.json'
      - 'package-lock.json'
      - 'patches/**'
      - 'apps/web/**'
      # The one file outside the workspaces that the web imports (the /design-system catalogue).
      - 'docs/fixtures/vt1/fixtures.ts'
      # Files Railway's own build reads (2026-09-29: a root .dockerignore broke the API build, run 36636596664).
      - '.dockerignore'
      - '.gitignore'
      - '.railwayignore'
      - 'railway.json'
      - 'railway.toml'
      - 'railpack.json'
      - 'nixpacks.toml'
      - '.npmrc'
      - 'mise.toml'
      - '.tool-versions'
      - 'Dockerfile'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      ship:
        description: changed = only services whose files differ from what they run; all = every service
        type: choice
        options: [changed, all]
        default: changed

# rollback.yml shares this group, so a rollback and a release never run at once. GitHub keeps ONE pending run per
# group: a newer run cancels the one still waiting, whichever workflow it belongs to.
concurrency:
  group: deploy-api
  cancel-in-progress: false

# Read-only by default; the `images` job alone may write (its packages).
permissions:
  contents: read

# Every `if:` below that must look past a skipped or failed job uses !cancelled(), never always(): always() would still
# start a deploy after someone cancelled the run.
jobs:
  # Which services must ship: those whose files differ from the commit each one runs now, read from its latest
  # successful Railway deployment (scripts/ci/release-changes.sh). Not the last successful run: a cancelled or failed
  # run, or a rollback, leaves a service on an older commit, and only the service knows which (2026-09-29: #179's
  # API landed although its run was cancelled). A service whose commit cannot be read ships; a service that already
  # runs a newer commit does not (a re-run of an old run must not roll it back); a service still on a source build
  # ships by image. Each deploy job checks its service again before changing it. `-f ship=all` ships everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      api: ${{ steps.diff.outputs.api }}
      worker: ${{ steps.diff.outputs.worker }}
      scheduler: ${{ steps.diff.outputs.scheduler }}
      background: ${{ steps.diff.outputs.background }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      # The whole history without file contents: enough to compare trees and to tell which commit is newer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # Without the CLI every service ships (the script cannot read what they run): too much, never too little.
      - name: Install Railway CLI (pinned)
        continue-on-error: true
        run: npm install -g @railway/cli@5.30.1

      - id: diff
        env:
          SHIP_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.ship == 'all' }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          API_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          WORKER_SERVICE: ${{ secrets.RAILWAY_WORKER_SERVICE }}
          SCHEDULER_SERVICE: ${{ secrets.RAILWAY_SCHEDULER_SERVICE }}
          WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE }}
        run: scripts/ci/release-changes.sh

  # The whole CI (ci.yml) on the exact commit being released. Before 2026-09-26 main deployed without
  # waiting for any check. docs/ci-plan.md §2.4.
  # No `secrets: inherit`: ci.yml reads no secret (the Turbo remote-cache values went with PR 3, #197).
  verify:
    name: Verify the exact release commit
    uses: ./.github/workflows/ci.yml

  # Both images of this commit, built and pushed beside `verify` (images.yml), so every release can be rolled back to.
  images:
    name: Images
    uses: ./.github/workflows/images.yml
    with:
      push: true
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # 2026-09-16 — eBay refuses the WHOLE Connect request when one scope is outside the
  # production app's keyset, and names none of them. Two were, so no eBay account could be
  # connected. This asks eBay before shipping: exit 1 names the refused scopes, exit 2 means
  # it could not measure (missing values, wrong app ID, eBay unreachable). Both stop the
  # deploy. The app ID and RuName are read from Railway, the one place production values
  # live — never copy them into GitHub. Runs beside `verify` since 2026-09-30 (it was a step of the API deploy).
  ebay:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    name: eBay accepts every consent scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Railway CLI (pinned)
        run: npm install -g @railway/cli@5.30.1
      - name: Check eBay accepts every consent scope
        working-directory: apps/api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          set -euo pipefail
          # The JSON holds EVERY Railway variable, secrets included: it goes straight into jq and
          # only the two public eBay identifiers come out. Never print it.
          pick='[.EBAY_CLIENT_ID // "", .EBAY_RUNAME // ""] | @tsv'
          if [ -n "$RAILWAY_SERVICE" ]; then
            ebay=$(railway variables list --service "$RAILWAY_SERVICE" --json | jq -r "$pick") || { echo "❌ could not read the eBay app values from Railway"; exit 2; }
          else
            ebay=$(railway variables list --json | jq -r "$pick") || { echo "❌ could not read the eBay app values from Railway"; exit 2; }
          fi
          EBAY_CLIENT_ID=$(cut -f1 <<< "$ebay") EBAY_RUNAME=$(cut -f2 <<< "$ebay") npx tsx scripts/check-ebay-consent-scopes.mts

  # No npm ci here: the job selects and deploys an image; it does not run the application code.
  deploy:
    needs: [changes, verify, images, ebay]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.api == 'true' &&
      needs.verify.result == 'success' && needs.ebay.result == 'success' &&
      needs.images.result == 'success'
    name: Ship the API to Railway
    runs-on: ubuntu-latest
    # railway-deploy-image.sh (about 27 minutes when every Railway request hangs) + the readiness loop.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Require prepared worker and scheduler services
        env:
          API_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          WORKER_SERVICE: ${{ secrets.RAILWAY_WORKER_SERVICE }}
          SCHEDULER_SERVICE: ${{ secrets.RAILWAY_SCHEDULER_SERVICE }}
        run: |
          test -n "$API_SERVICE" && test -n "$WORKER_SERVICE" && test -n "$SCHEDULER_SERVICE" &&
          test "$API_SERVICE" != "$WORKER_SERVICE" && test "$API_SERVICE" != "$SCHEDULER_SERVICE" && test "$WORKER_SERVICE" != "$SCHEDULER_SERVICE" || {
            echo "Configure three distinct API, worker and scheduler services before deploying. See tasks/architecture-operations.md."
            exit 1
          }

      - name: Install Railway CLI (pinned)
        run: npm install -g @railway/cli@5.30.1

      # 2026-09-30, run 36721092871: a job retry reused old `changes` outputs. Re-read just before the mutation.
      - name: Check whether the API still needs this release
        id: fresh
        env:
          SHIP_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.ship == 'all' }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ROLE: api
          SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: scripts/ci/release-changes.sh --only "$ROLE"

      - name: Deploy this commit's API image
        if: steps.fresh.outputs.ship == 'true'
        id: image
        # Returns at SUCCESS: Railway ran the pre-deploy migration and passed its health check. The image carries the
        # commit in apps/api/.release-sha, so the readiness check below still identifies this exact build.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          API_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-api:${{ github.sha }}
        run: scripts/ci/railway-deploy-image.sh --service "$API_SERVICE" --image "$IMAGE"

      - name: Smoke-test the new container
        # Check HTTP readiness even when a retry skips the deploy: Railway's SUCCESS alone is not HTTP proof.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          API_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          DEPLOYMENT_ID: ${{ steps.image.outputs.deployment_id }}
          EXPECTED_SHA: ${{ steps.fresh.outputs.expected_sha }}
        run: |
          set -euo pipefail
          : "${EXPECTED_SHA:?EXPECTED_SHA is required}"
          expected="${EXPECTED_SHA:0:8}"
          for _ in $(seq 1 144); do
            body=$(curl --max-time 10 -fsS "https://nexusapi-production-b7bb.up.railway.app/api/health/ready") || body='{}'
            if jq -e --arg build "$expected" '.status == "healthy" and .build == $build' <<< "$body" >/dev/null; then
              echo "✓ Railway is serving $expected"
              exit 0
            fi
            if [ -n "$DEPLOYMENT_ID" ]; then
              status=$(railway service status --service "$API_SERVICE" --json 2>/dev/null || echo '{}')
              if jq -e --arg id "$DEPLOYMENT_ID" '.deploymentId == $id and (.status == "FAILED" or .status == "CRASHED")' <<< "$status" >/dev/null; then
                echo "✗ Railway reports deployment $DEPLOYMENT_ID as $(jq -r .status <<< "$status") — the previous build keeps serving"
                exit 1
              fi
            fi
            sleep 5
          done
          echo "✗ Railway did not serve $expected within 12 minutes"
          exit 1

  # The worker and scheduler ship the same commit once the API serves it, side by side and each
  # with its own time limit. In one job, three sequential builds overran its 25 minutes
  # (2026-09-26): the job was cancelled while the scheduler's build was still running.
  # Only the roles in `changes.background` ship. When the API ships too, they wait for it and never follow a failed
  # or skipped API deploy (the eBay check included); otherwise they go on their own.
  # 40 minutes: railway-deploy-image.sh can take about 27 when every Railway request hangs to its limit, and it should
  # still print its own "✗ …" line before GitHub ends the job (review of PR 2, 2026-09-30).
  deploy-background:
    needs: [changes, verify, images, deploy]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.background != '[]' &&
      needs.verify.result == 'success' && needs.images.result == 'success' &&
      (needs.changes.outputs.api != 'true' || needs.deploy.result == 'success')
    name: Ship ${{ matrix.role }} to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.changes.outputs.background) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # The same check as the API job's: this job may run without it.
      - name: Require prepared worker and scheduler services
        env:
          API_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          WORKER_SERVICE: ${{ secrets.RAILWAY_WORKER_SERVICE }}
          SCHEDULER_SERVICE: ${{ secrets.RAILWAY_SCHEDULER_SERVICE }}
        run: |
          test -n "$API_SERVICE" && test -n "$WORKER_SERVICE" && test -n "$SCHEDULER_SERVICE" &&
          test "$API_SERVICE" != "$WORKER_SERVICE" && test "$API_SERVICE" != "$SCHEDULER_SERVICE" && test "$WORKER_SERVICE" != "$SCHEDULER_SERVICE" || {
            echo "Configure three distinct API, worker and scheduler services before deploying. See tasks/architecture-operations.md."
            exit 1
          }

      - name: Install Railway CLI (pinned)
        run: npm install -g @railway/cli@5.30.1

      - name: Check whether ${{ matrix.role }} still needs this release
        id: fresh
        env:
          SHIP_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.ship == 'all' }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ROLE: ${{ matrix.role }}
          # No fall-through: an empty worker ID must not deploy the scheduler service.
          SERVICE: ${{ matrix.role == 'worker' && secrets.RAILWAY_WORKER_SERVICE || matrix.role == 'scheduler' && secrets.RAILWAY_SCHEDULER_SERVICE || '' }}
        run: scripts/ci/release-changes.sh --only "$ROLE"

      - name: Deploy ${{ matrix.role }} from the same API image
        if: steps.fresh.outputs.ship == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ matrix.role == 'worker' && secrets.RAILWAY_WORKER_SERVICE || matrix.role == 'scheduler' && secrets.RAILWAY_SCHEDULER_SERVICE || '' }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-api:${{ github.sha }}
        run: scripts/ci/railway-deploy-image.sh --service "$SERVICE" --image "$IMAGE"

  # The web ships after the API serves the same commit (its pages may call new API routes), or alone when only the web
  # changed. When the API ships too, a failed or skipped API deploy (the eBay check included) holds the web back.
  # needs.changes.result too: a failed `changes` job still hands over the outputs it wrote (actions/runner#2598).
  # The image deploy script waits for Railway's SUCCESS before the production smoke can run.
  deploy-web:
    needs: [changes, verify, images, deploy]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.web == 'true' &&
      needs.verify.result == 'success' &&
      needs.images.result == 'success' &&
      (needs.changes.outputs.api != 'true' || needs.deploy.result == 'success')
    name: Ship the web to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Require the web service
        env:
          WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE }}
        run: test -n "$WEB_SERVICE" || { echo "Set the RAILWAY_WEB_SERVICE secret to the nexus-web service ID."; exit 1; }

      - name: Install Railway CLI (pinned)
        run: npm install -g @railway/cli@5.30.1

      - name: Check whether the web still needs this release
        id: fresh
        env:
          SHIP_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.ship == 'all' }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ROLE: web
          SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE }}
        run: scripts/ci/release-changes.sh --only "$ROLE"

      - name: Deploy this commit's web image
        if: steps.fresh.outputs.ship == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-web:${{ github.sha }}
        run: scripts/ci/railway-deploy-image.sh --service "$WEB_SERVICE" --image "$IMAGE"

  # A status function: without one a skipped API deploy (a web-only push) skips this job too, though deploy-web
  # succeeded (run 36557837250, 2026-09-29).
  smoke-web:
    needs: deploy-web
    if: ${{ !cancelled() && needs.deploy-web.result == 'success' }}
    name: Web production smoke
    uses: ./.github/workflows/prod-smoke.yml
    with:
      url: ${{ vars.NEXUS_WEB_URL }}
