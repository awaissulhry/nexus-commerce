# Deploy to Railway from GitHub Actions: the API first, then the worker, scheduler and web.
#
# Railway's native GitHub integration is unreliable on this project
# (it stops auto-deploying after rebases or after the worker crashes
# on a Redis hiccup). This workflow takes over. Every push to main that
# touches a shipped path runs the whole CI on that exact commit (`verify`),
# builds both Docker images beside it (`images`, images.yml) and asks eBay
# about the consent scopes (`ebay`). Only then does anything ship. The API
# applies migrations in Railway's pre-deploy step, and Railway waits for
# /api/health/ready before switching traffic.
#
# A service ships one of two ways (docs/ci-fast-deploys/PLAN-2026-09-29.md §2, §7):
#   by image    — the repository variable RAILWAY_IMAGE_SERVICES names it (a comma list of api, worker, scheduler,
#                 web). Railway runs ghcr.io/<owner>/nexus-api:<sha> (api, worker, scheduler) or nexus-web:<sha> and
#                 builds nothing (scripts/ci/railway-deploy-image.sh). The Owner moves one service at a time.
#   railway up  — every other service: Railway builds the uploaded source (scripts/ci/railway-up.sh), as before.
# An empty variable ships everything with `railway up`. To go back to an earlier commit: rollback.yml
# (runbook in tasks/architecture-operations.md).
#
# Required secrets (set under repo Settings → Secrets and variables
# → Actions):
#   RAILWAY_TOKEN  — Project-scoped token from railway.app/account/
#                    tokens. Scope to the Nexus project so this
#                    workflow can't push to other Railway projects.
#
# Optional secret:
#   RAILWAY_SERVICE — Railway service ID for the API. Omit if the
#                     project has exactly one service.
#
# The web app (apps/web) ships from here too, since 2026-09-29 (it left Vercel): job `deploy-web`, after the API
# serves the same commit, then `smoke-web`. It needs the secret RAILWAY_WEB_SERVICE (the `nexus-web` service ID)
# and the repository variable NEXUS_WEB_URL (its public address). The `changes` job ships only what changed.

name: Deploy API

on:
  push:
    branches: [main]
    # What the services and their images are built from, and the pipeline that ships them (images.yml no longer runs
    # on its own push: it runs here, once per release).
    paths:
      - 'apps/api/**'
      - 'packages/database/**'
      - 'packages/shared/**'
      - 'packages/events/**'
      - 'package.json'
      - 'package-lock.json'
      - 'patches/**'
      - 'apps/web/**'
      - 'turbo.json'
      - '.dockerignore'
      - 'docs/fixtures/vt1/fixtures.ts'
      - 'scripts/ci/check-image-secrets.sh'
      - 'scripts/ci/image-services.sh'
      - 'scripts/ci/railway-deploy-image.sh'
      - 'scripts/ci/railway-up.sh'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/images.yml'
      - '.github/workflows/prod-smoke.yml'
  workflow_dispatch:

# rollback.yml shares this group, so a rollback and a release never run at once. GitHub keeps ONE pending run per
# group: a newer run cancels the one still waiting, whichever workflow it belongs to.
concurrency:
  group: deploy-api
  cancel-in-progress: false

# Every `if:` below that must look past a skipped or failed job uses !cancelled(), never always(): always() would still
# start a deploy after someone cancelled the run.
jobs:
  # Which services changed since the last release that fully succeeded. Not since the previous commit: a newer push
  # cancels a run still waiting in the `deploy-api` group, and a failed run may not have shipped everything — their
  # changes must ride with this run (2026-09-29: #164's API change was in a cancelled run). A hand run
  # (workflow_dispatch) ships everything; so does a push when that release cannot be found or read, and a push after a
  # rollback (rollback.yml): a service this push does not change would otherwise stay on the rolled-back commit.
  # Code of one service ships that service; what builds or ships the services (dependencies, the images, the
  # workflows and scripts/ci) ships both, so a pipeline change is proven end to end by its own release.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
      image_api: ${{ steps.mode.outputs.api }}
      image_worker: ${{ steps.mode.outputs.worker }}
      image_scheduler: ${{ steps.mode.outputs.scheduler }}
      image_web: ${{ steps.mode.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      # Before `diff`: GitHub keeps the outputs a job wrote before it failed (actions/runner#2598). With `diff` first, a
      # typo in the variable failed this job after web=true was written, and deploy-web could still ship (review of
      # PR 2, 2026-09-30). deploy-web also requires this job to succeed.
      - id: mode
        name: Which services deploy by image (RAILWAY_IMAGE_SERVICES)
        env:
          RAILWAY_IMAGE_SERVICES: ${{ vars.RAILWAY_IMAGE_SERVICES }}
        run: scripts/ci/image-services.sh >> "$GITHUB_OUTPUT"
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=true web=true
          release=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-api.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.head_sha) \(.created_at)"' 2>/dev/null) || release=''
          base=${release%% *} released_at=${release#* }
          # A rollback came after that release when any attempt of it was queued after the release was created.
          # - Rollback side: run_started_at, the queue time of the latest attempt. A re-run moves it; created_at stays
          #   (run 36433436446: created 14:06:13, attempt 2 started 14:19:41).
          # - Release side: created_at. A re-run of its failed jobs reuses the first attempt's `changes` outputs, so the
          #   release decided what to ship when it was created.
          # - Runs in the deploy-api group never overlap, so a rollback queued later ran after the release decided.
          # - Every recent rollback, not the newest only: an older one can be re-run after a newer one.
          # - Whatever its result: one that failed half-way may still have moved a service.
          rollback=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rollback.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | {id, at: (.run_started_at // .created_at)}] | max_by(.at) // empty | "\(.id) \(.at)"' \
            2>/dev/null) || rollback=unreadable
          if [ "$EVENT" = push ] && [ -n "$base" ] && git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
            if [ "$rollback" = unreadable ]; then
              echo "The rollback runs could not be read: shipping everything."
            elif [ -n "$rollback" ] && [[ "${rollback#* }" > "$released_at" ]]; then
              echo "Rollback run ${rollback%% *} (attempt queued ${rollback#* }) came after the last successful release ($released_at): shipping everything."
            else
              files=$(git diff --name-only "$base" "$GITHUB_SHA")
              echo "Changed since $base, the last successful release:"
              printf '%s\n' "$files"
              shared='package(-lock)?\.json$|patches/|turbo\.json$|\.dockerignore$|scripts/ci/(check-image-secrets|image-services|railway-deploy-image|railway-up)\.sh$|\.github/workflows/(deploy-api|ci|images)\.yml$'
              grep -qE "^(apps/api/|packages/(database|shared|events)/|$shared)" <<< "$files" && api=true || api=false
              grep -qE "^(apps/web/|packages/(database|shared)/|docs/fixtures/vt1/fixtures\.ts$|\.github/workflows/prod-smoke\.yml$|$shared)" <<< "$files" && web=true || web=false
            fi
          fi
          echo "api=$api web=$web"
          { echo "api=$api"; echo "web=$web"; } >> "$GITHUB_OUTPUT"

  # The whole CI (ci.yml) on the exact commit being released. Before 2026-09-26 main deployed without
  # waiting for any check. docs/ci-plan.md §2.4.
  verify:
    name: Verify the exact release commit
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Both images of this commit, built and pushed beside `verify` (images.yml). Every release builds both, even for a
  # service that still ships with `railway up`, so every released commit can be rolled back to.
  images:
    name: Images
    uses: ./.github/workflows/images.yml
    with:
      push: true
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # 2026-09-16 — eBay refuses the WHOLE Connect request when one scope is outside the
  # production app's keyset, and names none of them. Two were, so no eBay account could be
  # connected. This asks eBay before shipping: exit 1 names the refused scopes, exit 2 means
  # it could not measure (missing values, wrong app ID, eBay unreachable). Both stop the
  # deploy. The app ID and RuName are read from Railway, the one place production values
  # live — never copy them into GitHub. Runs beside `verify` since 2026-09-30 (it was a step of the API deploy).
  ebay:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    name: eBay accepts every consent scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Railway CLI (pinned)
        run: npm install -g @railway/cli@5.30.1
      - name: Check eBay accepts every consent scope
        working-directory: apps/api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          set -euo pipefail
          # The JSON holds EVERY Railway variable, secrets included: it goes straight into jq and
          # only the two public eBay identifiers come out. Never print it.
          pick='[.EBAY_CLIENT_ID // "", .EBAY_RUNAME // ""] | @tsv'
          if [ -n "$RAILWAY_SERVICE" ]; then
            ebay=$(railway variables list --service "$RAILWAY_SERVICE" --json | jq -r "$pick") || { echo "❌ could not read the eBay app values from Railway"; exit 2; }
          else
            ebay=$(railway variables list --json | jq -r "$pick") || { echo "❌ could not read the eBay app values from Railway"; exit 2; }
          fi
          EBAY_CLIENT_ID=$(cut -f1 <<< "$ebay") EBAY_RUNAME=$(cut -f2 <<< "$ebay") npx tsx scripts/check-ebay-consent-scopes.mts

  # No npm ci here: nothing below runs the code. `railway up` uploads the checkout minus .gitignore (there is no
  # .railwayignore), and the setup action's builds leave `git status` clean (measured 2026-09-30), so the upload is the
  # same without them.
  deploy:
    needs: [changes, verify, images, ebay]
    if: needs.changes.outputs.api == 'true'
    name: Ship the API to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 40  # railway up (~11 min measured) + up to 12 min for pre-deploy and healthcheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require prepared worker and scheduler services
        env:
          API_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          WORKER_SERVICE: ${{ secrets.RAILWAY_WORKER_SERVICE }}
          SCHEDULER_SERVICE: ${{ secrets.RAILWAY_SCHEDULER_SERVICE }}
        run: |
          test -n "$API_SERVICE" && test -n "$WORKER_SERVICE" && test -n "$SCHEDULER_SERVICE" &&
          test "$API_SERVICE" != "$WORKER_SERVICE" && test "$API_SERVICE" != "$SCHEDULER_SERVICE" && test "$WORKER_SERVICE" != "$SCHEDULER_SERVICE" || {
            echo "Configure three distinct API, worker and scheduler services before deploying. See tasks/architecture-operations.md."
            exit 1
          }

      - name: Install Railway CLI (pinned)
        run: npm install -g @railway/cli@5.30.1

      # No API build or test here: `verify` ran the whole CI on this exact commit (the whole API suite
      # includes the catalog CSV limits), and Railway builds from source (or runs this commit's image)
      # before the container starts.

      - name: Trigger Railway deploy
        if: needs.changes.outputs.image_api != 'true'
        id: up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # CLI uploads have no GitHub-trigger variables. Carry the checkout's SHA
          # with the uploaded source so readiness can identify this exact build.
          printf '%s\n' "$GITHUB_SHA" > apps/api/.release-sha
          # Retried only when Railway's builder cannot download its own tools (scripts/ci/railway-up.sh).
          scripts/ci/railway-up.sh --service "${{ secrets.RAILWAY_SERVICE }}" --ci --message "GitHub ${{ github.sha }}"

      - name: Deploy this commit's API image
        if: needs.changes.outputs.image_api == 'true'
        id: image
        # Returns at SUCCESS: Railway ran the pre-deploy migration and passed its health check. The image carries the
        # commit in apps/api/.release-sha, so the readiness check below still identifies this exact build.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          API_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-api:${{ github.sha }}
        run: scripts/ci/railway-deploy-image.sh --service "$API_SERVICE" --image "$IMAGE"

      - name: Smoke-test the new container
        # `railway up` returns when the BUILD ends. Railway then runs the pre-deploy migration and waits for
        # its own healthcheck (up to 300 s) before it switches traffic: measured 2026-09-26, run 36265845583,
        # 6 minutes from the end of the build to SUCCESS, while a 3-minute window had already failed the
        # run and skipped the worker and scheduler. So: up to 12 minutes, failing at once if Railway
        # reports this deployment FAILED or CRASHED. After an image deploy Railway already reports SUCCESS,
        # and this passes on its first read.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          API_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          DEPLOYMENT_ID: ${{ steps.up.outputs.deployment_id || steps.image.outputs.deployment_id }}
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA:0:8}"
          for _ in $(seq 1 144); do
            body=$(curl --max-time 10 -fsS "https://nexusapi-production-b7bb.up.railway.app/api/health/ready") || body='{}'
            if jq -e --arg build "$expected" '.status == "healthy" and .build == $build' <<< "$body" >/dev/null; then
              echo "✓ Railway is serving $expected"
              exit 0
            fi
            if [ -n "$DEPLOYMENT_ID" ]; then
              status=$(railway service status --service "$API_SERVICE" --json 2>/dev/null || echo '{}')
              if jq -e --arg id "$DEPLOYMENT_ID" '.deploymentId == $id and (.status == "FAILED" or .status == "CRASHED")' <<< "$status" >/dev/null; then
                echo "✗ Railway reports deployment $DEPLOYMENT_ID as $(jq -r .status <<< "$status") — the previous build keeps serving"
                exit 1
              fi
            fi
            sleep 5
          done
          echo "✗ Railway did not serve $expected within 12 minutes"
          exit 1

  # The worker and scheduler ship the same commit once the API serves it, side by side and each
  # with its own time limit. In one job, three sequential builds overran its 25 minutes
  # (2026-09-26): the job was cancelled while the scheduler's build was still running.
  # 40 minutes: railway-deploy-image.sh can take about 38 when every Railway request hangs to its limit, and it should
  # still print its own "✗ …" line before GitHub ends the job (review of PR 2, 2026-09-30).
  # No status function: when the API deploy is skipped or fails, these must not ship.
  deploy-background:
    needs: [changes, deploy]
    name: Ship ${{ matrix.role }} to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        role: [worker, scheduler]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI (pinned)
        run: npm install -g @railway/cli@5.30.1

      - name: Deploy ${{ matrix.role }} from the same release
        if: >-
          !(matrix.role == 'worker' && needs.changes.outputs.image_worker == 'true' ||
          matrix.role == 'scheduler' && needs.changes.outputs.image_scheduler == 'true')
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ matrix.role == 'worker' && secrets.RAILWAY_WORKER_SERVICE || secrets.RAILWAY_SCHEDULER_SERVICE }}
        run: scripts/ci/railway-up.sh --service "$SERVICE" --ci --message "${{ matrix.role }} GitHub ${{ github.sha }}"

      - name: Deploy ${{ matrix.role }} from the same API image
        if: >-
          matrix.role == 'worker' && needs.changes.outputs.image_worker == 'true' ||
          matrix.role == 'scheduler' && needs.changes.outputs.image_scheduler == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ matrix.role == 'worker' && secrets.RAILWAY_WORKER_SERVICE || secrets.RAILWAY_SCHEDULER_SERVICE }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-api:${{ github.sha }}
        run: scripts/ci/railway-deploy-image.sh --service "$SERVICE" --image "$IMAGE"

  # The web ships after the API serves the same commit (its pages may call new API routes), or alone when only the web
  # changed. When the API changed too, a failed or skipped API deploy (eBay check included) holds the web back.
  # needs.changes.result too: a failed `changes` job still hands over the outputs it wrote (actions/runner#2598).
  # `railway up` returns when the build ends; Railway then waits for /login to answer before it switches traffic, so
  # the railway-up path waits for the deployment itself to report SUCCESS. The image path does that in its script.
  deploy-web:
    needs: [changes, verify, images, deploy]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.web == 'true' &&
      needs.verify.result == 'success' && needs.images.result == 'success' &&
      (needs.changes.outputs.api != 'true' || needs.deploy.result == 'success')
    name: Ship the web to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require the web service
        env:
          WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE }}
        run: test -n "$WEB_SERVICE" || { echo "Set the RAILWAY_WEB_SERVICE secret to the nexus-web service ID."; exit 1; }

      - name: Install Railway CLI (pinned)
        run: npm install -g @railway/cli@5.30.1

      - name: Trigger Railway deploy
        if: needs.changes.outputs.image_web != 'true'
        id: up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: scripts/ci/railway-up.sh --service "${{ secrets.RAILWAY_WEB_SERVICE }}" --ci --message "web GitHub ${{ github.sha }}"

      - name: Wait until Railway serves the new web build
        if: needs.changes.outputs.image_web != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE }}
          DEPLOYMENT_ID: ${{ steps.up.outputs.deployment_id }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_ID" || { echo "✗ railway up printed no deployment id"; exit 1; }
          for _ in $(seq 1 144); do
            status=$(railway service status --service "$WEB_SERVICE" --json 2>/dev/null || echo '{}')
            state=$(jq -r --arg id "$DEPLOYMENT_ID" 'if .deploymentId == $id then .status else "WAITING" end' <<< "$status")
            case "$state" in
              SUCCESS) echo "✓ Railway serves web deployment $DEPLOYMENT_ID"; exit 0 ;;
              FAILED|CRASHED|REMOVED) echo "✗ Railway reports web deployment $DEPLOYMENT_ID as $state — the previous build keeps serving"; exit 1 ;;
            esac
            sleep 5
          done
          echo "✗ Railway did not serve web deployment $DEPLOYMENT_ID within 12 minutes"
          exit 1

      - name: Deploy this commit's web image
        if: needs.changes.outputs.image_web == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          WEB_SERVICE: ${{ secrets.RAILWAY_WEB_SERVICE }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-web:${{ github.sha }}
        run: scripts/ci/railway-deploy-image.sh --service "$WEB_SERVICE" --image "$IMAGE"

  # A status function: without one a skipped API deploy (a web-only push) skips this job too, though deploy-web
  # succeeded (run 36557837250, 2026-09-29).
  smoke-web:
    needs: deploy-web
    if: ${{ !cancelled() && needs.deploy-web.result == 'success' }}
    name: Web production smoke
    uses: ./.github/workflows/prod-smoke.yml
    with:
      url: ${{ vars.NEXUS_WEB_URL }}
