# Production smoke for the web app — docs/ci-plan.md §2.4 (Tier D).
#
# Runs after deploy-api.yml ships the web to Railway (job `smoke-web`), or by hand. Read-only: the sign-in page,
# the web proxy's view of API health, and the page's own static assets. Nothing signs in or writes.
# The API's own post-deploy checks live in deploy-api.yml. Before 2026-09-29 it ran on Vercel's deployment_status.

name: Production smoke

on:
  workflow_call:
    inputs:
      url:
        description: Production web URL
        required: true
        type: string
  workflow_dispatch:
    inputs:
      url:
        description: Production web URL (https://….up.railway.app)
        required: true

permissions:
  contents: read

jobs:
  web:
    name: Web production smoke (read-only)
    # Pinned: ubuntu-latest became Ubuntu 26.04 (Nov 2026) and Playwright 1.60 refuses to install Chromium there,
    # so the smoke failed before any test ran. Move back to ubuntu-latest once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The Playwright version is read, not written here (2026-09-30): a written 1.60.0 would outlive a Playwright
      # bump, restore the old browser under the old key, skip the install, and the checks could not start a browser.
      - name: Playwright version (browser cache key)
        id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('@playwright/test/package.json').version")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Playwright browser
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-prod-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - name: '@prod checks'
        working-directory: apps/web
        env:
          PROD_BASE_URL: ${{ inputs.url }}
        run: npx playwright test -c smoke/prod.config.ts
