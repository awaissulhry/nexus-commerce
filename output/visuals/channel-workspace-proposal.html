      const manageGroups=[{name:'AMAZON',connected:true,items:[['presets-amazon','Listing presets','sliders-horizontal'],['mapping','Category mappings','git-branch']]},{name:'EBAY',connected:true,items:[['themes','Description themes','panels-top-left'],['ordering','Variation order rules','list-ordered'],['presets-ebay','Listing presets','sliders-horizontal']]},{name:'CONNECTIONS',items:[['accounts','Accounts & markets','plug']]}];
      const icon=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';

      const source=s=>'<span class="nc-source">'+icon(s.startsWith('Customized')?'pin':'link-2')+s+'</span>';
      const label=state=>state.theme==='standard'?'Xavia · Standard':'Xavia · Minimal';
      const sizes=()=>state.sizeOrder==='ascending'?['XS','S','M','L','XL']:['XL','L','M','S','XS'];
      function preview(theme=state.theme){return '<section class="nc-preview" aria-label="eBay buyer preview"><div class="nc-preview-head"><span>'+icon('eye')+' Buyer preview</span><span class="nc-muted">eBay · '+markets[state.market]+'</span></div><div class="nc-preview-body"><h3>'+esc(state.productName)+'</h3><div class="nc-price">€149.90</div>'+state.axes.map(axis=>'<div><span class="nc-muted">'+axis+'</span><div class="nc-options">'+(axis==='Size'?sizes():['Black','Yellow']).map(v=>'<span class="nc-option">'+v+'</span>').join('')+'</div></div>').join('')+'<div class="nc-theme '+(theme==='minimal'?'minimal':'')+'"><div class="nc-theme-brand">XAVIA RACING</div><h4>Built for the ride.</h4><p>Waterproof motorcycle jacket with adjustable ventilation and protective inserts.</p><p>Product description · from shared product information</p></div></div></section>';}
      function axesEditor(){return '<div class="nc-axes">'+state.axes.map((axis,i)=>'<div class="nc-axis"><span class="nc-axis-number">'+(i+1)+'</span><span class="nc-axis-name">'+axis+'</span><button class="nc-icon" type="button" data-axis="'+axis+'" aria-label="Move '+axis+' '+(i?'up':'down')+'">'+icon(i?'arrow-up':'arrow-down')+'</button></div>').join('')+'</div><label class="nc-field">Size values<select data-size-order><option value="ascending" '+(state.sizeOrder==='ascending'?'selected':'')+'>XS → XL</option><option value="descending" '+(state.sizeOrder==='descending'?'selected':'')+'>XL → XS</option></select></label>';}
      function presentation(){return '<div class="nc-section-head"><div><h2>Listing presentation</h2><p>This product’s appearance on eBay.</p></div>'+badge('Product setting')+'</div><div class="nc-columns"><div class="nc-form-card"><section class="nc-form-section"><div class="nc-label-row"><h3>Description theme</h3><button class="nc-text-button" type="button" data-manage-themes>Manage themes '+icon('arrow-up-right')+'</button></div><label class="nc-field">Assigned theme<select data-theme><option value="standard" '+(state.theme==='standard'?'selected':'')+'>Xavia · Standard</option><option value="minimal" '+(state.theme==='minimal'?'selected':'')+'>Xavia · Minimal</option></select></label><div style="margin-top:8px">'+source(state.theme==='standard'?'From eBay listing preset':'Customized for this listing')+'</div></section><section class="nc-form-section"><div class="nc-label-row"><h3>Variation order</h3>'+badge('eBay only')+'</div><span class="nc-muted">Buyer selector order</span>'+axesEditor()+'</section></div>'+preview()+'</div><div class="nc-bottomline">'+icon('pin')+'Applies to GALE-JACKET · eBay · '+markets[state.market]+'</div>';}
      function productData(){return '<div class="nc-section-head"><div><h2>Shared product information</h2><p>One product family. Shared across connected channels.</p></div>'+badge('Master data')+'</div><div class="nc-form-card"><div class="nc-form-section"><label class="nc-field" style="margin-top:0">Product name<input data-product-name value="'+esc(state.productName)+'"></label><div style="margin-top:9px">'+source('Used by Amazon and eBay')+'</div></div></div><div class="nc-table-wrap" style="margin-top:18px"><div class="nc-table-scroll"><table><thead><tr><th>Product / SKU</th><th>Color</th><th>Size</th><th>Amazon</th><th>eBay</th></tr></thead><tbody>'+[['GALE-JACKET','—','—','Parent'],['GALE-BLACK-S','Black','S','Variation'],['GALE-BLACK-M','Black','M','Variation'],['GALE-YELLOW-M','Yellow','M','Variation']].map(r=>'<tr><td>'+r[0]+'<span class="nc-product-id">'+r[3]+'</span></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+badge('Linked','good')+'</td><td>'+badge('Linked','good')+'</td></tr>').join('')+'</tbody></table></div></div>';}
      function listing(){const channel=state.page.startsWith('amazon')?'Amazon':'eBay';return '<div class="nc-section-head"><div><h2>'+channel+' listing</h2><p>'+markets[state.market]+' · Xavia Racing account</p></div>'+badge('Draft changes')+'</div><div class="nc-columns"><div class="nc-form-card"><div class="nc-form-section"><div class="nc-label-row"><h3>Title</h3>'+source('From product')+'</div><p>'+esc(state.productName)+'</p></div><div class="nc-form-section"><div class="nc-label-row"><h3>Category</h3>'+source('From mapping')+'</div><p>Motorcycle jackets</p></div><div class="nc-form-section"><div class="nc-label-row"><h3>Listing preset</h3>'+badge('Inherited')+'</div><p>Xavia · Apparel · '+markets[state.market]+'</p></div></div><div class="nc-form-card"><div class="nc-form-section"><h3>Listing requirements</h3><div class="nc-list-row"><div>Title and product information</div>'+badge('Ready','good')+'</div><div class="nc-list-row"><div>Category and variations</div>'+badge('Ready','good')+'</div><div class="nc-list-row"><div>Product images</div>'+badge('Ready','good')+'</div></div><div class="nc-form-section">'+(channel==='eBay'?'<button type="button" class="nc-button" data-go="ebay-presentation">'+icon('panels-top-left')+' Edit presentation</button>':'<span class="nc-muted">Shared information follows the product; listing presets supply channel defaults.</span>')+'</div></div></div>';}
      function themes(){if(state.libraryEdit)return '<div class="nc-section-head"><div><h2>'+label({theme:state.libraryTheme})+'</h2><p>Reusable description theme</p></div><button type="button" class="nc-button" data-library-back>'+icon('arrow-left')+' Theme library</button></div><div class="nc-notice">Library setting · changes can affect every listing assigned to this theme.</div><div class="nc-columns"><div class="nc-form-card"><div class="nc-form-section"><h3>Theme design</h3><label class="nc-field">Header treatment<select data-library-theme><option value="standard" '+(state.libraryTheme==='standard'?'selected':'')+'>Branded header</option><option value="minimal" '+(state.libraryTheme==='minimal'?'selected':'')+'>Minimal header</option></select></label></div><div class="nc-form-section"><h3>Preview product</h3><p style="margin-top:8px">GALE-JACKET</p><div style="margin-top:8px">'+source('Product text stays connected')+'</div></div></div>'+preview(state.libraryTheme)+'</div>';return '<div class="nc-section-head"><div><h2>Description themes</h2><p>Reusable eBay designs, managed in one place.</p></div>'+badge('Channel library')+'</div><div class="nc-library">'+['standard','minimal'].map(t=>'<article class="nc-theme-tile"><div class="nc-tile-art nc-theme '+(t==='minimal'?'minimal':'')+'" style="margin:0;border:0"><div class="nc-theme-brand">XAVIA RACING</div><h3>Product description</h3><div class="nc-muted">Connected product content</div></div><div class="nc-tile-caption"><div><h3>Xavia · '+(t==='standard'?'Standard':'Minimal')+'</h3><span class="nc-muted">'+(t==='standard'?'Default for apparel':'Optional listing theme')+'</span></div><button type="button" class="nc-button" data-edit-theme="'+t+'">Open theme</button></div></article>').join('')+'</div><div class="nc-bottomline">'+icon('layers')+'Scope: eBay theme library · all assigned products</div>';}
      function ordering(){return '<div class="nc-section-head"><div><h2>Variation order rules</h2><p>Reusable defaults for compatible product families.</p></div>'+badge('Channel setting')+'</div><div class="nc-form-card"><div class="nc-list-row"><div><h3>Motorcycle apparel</h3><p>Color → Size · sizes XS → XL</p></div>'+badge('Default','good')+'</div><div class="nc-list-row"><div><h3>Footwear</h3><p>Size → Color · numeric sizes ascending</p></div>'+badge('Category rule')+'</div></div><div class="nc-bottomline">'+icon('pin')+'A product can override its presentation without changing the shared rule.</div>';}
      function presets(){const amazon=state.page==='presets-amazon';return '<div class="nc-section-head"><div><h2>Listing presets</h2><p>'+ (amazon?'Amazon':'eBay')+' defaults by market and product type.</p></div>'+badge('Channel setting')+'</div><div class="nc-form-card">'+Object.entries(markets).map(([k,v])=>'<div class="nc-list-row"><div><h3>Xavia · Apparel · '+v+'</h3><p>'+(amazon?'Category mapping · attribute defaults':'Description theme · business policies · variation order')+'</p></div>'+badge('Assigned','good')+'</div>').join('')+'</div>';}
      function mapping(){return '<div class="nc-section-head"><div><h2>Category mappings</h2><p>Shared product information translated into Amazon fields.</p></div>'+badge('Channel setting')+'</div><div class="nc-table-wrap"><div class="nc-table-scroll"><table><thead><tr><th>Product information</th><th>Amazon field</th><th>Rule</th></tr></thead><tbody><tr><td>Product name</td><td>Item name</td><td>Use selected language</td></tr><tr><td>Brand</td><td>Brand</td><td>Use product value</td></tr><tr><td>Color</td><td>Color name</td><td>Use variation value</td></tr><tr><td>Size</td><td>Size name</td><td>Use variation value</td></tr></tbody></table></div></div>';}
      function accounts(){return '<div class="nc-section-head"><div><h2>Connected accounts</h2><p>Available destinations for listing and publishing.</p></div></div><div class="nc-form-card">'+['Amazon','eBay'].map(c=>'<div class="nc-list-row"><div><h3>'+c+' · Xavia Racing</h3><p>Italy · Germany · France</p></div>'+badge('Connected','good')+'</div>').join('')+'</div>';}
      function issues(){return '<div class="nc-section-head"><div><h2>Needs attention</h2><p>GALE-JACKET · all connected channels and markets</p></div>'+badge('2 issues','warn')+'</div><div class="nc-form-card"><div class="nc-list-row"><div><h3>German title missing</h3><p>Amazon · Germany · fix once in shared product information</p></div><button class="nc-button" type="button" data-go="data">Open product</button></div><div class="nc-list-row"><div><h3>Review description theme</h3><p>eBay · Italy · appearance changed since the last publication</p></div><button class="nc-button" type="button" data-go="ebay-presentation">Review presentation</button></div></div>';}
      function performance(){return '<div class="nc-section-head"><div><h2>Performance</h2><p>GALE-JACKET · last 30 days · sample report</p></div>'+badge('Reporting currency: EUR')+'</div><div class="nc-table-wrap"><div class="nc-table-scroll"><table><thead><tr><th>Destination</th><th>Units sold</th><th>Sales</th><th>Returns</th></tr></thead><tbody><tr><td>Amazon · Italy</td><td>24</td><td>€3,597.60</td><td>1</td></tr><tr><td>Amazon · Germany</td><td>16</td><td>€2,398.40</td><td>0</td></tr><tr><td>eBay · Italy</td><td>12</td><td>€1,798.80</td><td>1</td></tr></tbody></table></div></div><div class="nc-bottomline">'+icon('clock')+'Illustrative values · reporting period and data freshness stay visible.</div>';}
      function media(){return '<div class="nc-section-head"><div><h2>Product media</h2><p>Shared assets with channel-specific assignments.</p></div>'+badge('Master library')+'</div><div class="nc-table-wrap"><div class="nc-table-scroll"><table><thead><tr><th>Asset</th><th>Product</th><th>Amazon</th><th>eBay</th></tr></thead><tbody>'+['Front view','Back view','Ventilation detail','Protection detail'].map((s,i)=>'<tr><td>'+icon('image')+' '+s+'</td><td>GALE-JACKET</td><td>'+badge(i?'Gallery':'Main')+'</td><td>'+badge(i?'Gallery':'Main')+'</td></tr>').join('')+'</tbody></table></div></div>';}
      function renderContent(){const pages={data:productData,media, 'amazon-listing':listing,'ebay-listing':listing,'ebay-presentation':presentation,issues,performance,themes,ordering,'presets-amazon':presets,'presets-ebay':presets,mapping,accounts};q('[data-content]').innerHTML=pages[state.page]();}
      function render(){
        root.style.setProperty('--nds-nav-row',state.density==='Compact'?'34px':'40px');
        const management=state.workspace==='management';
        q('[data-workspace]').value=state.workspace;
        q('.nc-top-context').textContent=management?'Channels / Configuration':'Products / GALE-JACKET';
        root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.workspace)));
        q('[data-page-title]').textContent=(management?'': 'GALE-JACKET · ')+titles[state.page];
        q('[data-review]').hidden=management||state.page!=='ebay-presentation';
        const channel=state.page.startsWith('amazon')||['mapping','presets-amazon'].includes(state.page)?'Amazon':state.page.startsWith('ebay')||['themes','ordering','presets-ebay'].includes(state.page)?'eBay':null;
        const local=!management&&channel;
        q('[data-context]').innerHTML=(channel?badge(channel):badge(management?'Connected channels':'Shared product'))+'<span>'+ (management?'Reusable settings':channel?'Listing settings':'Product information')+'</span>'+(local?'<label>Market<select data-market aria-label="Market">'+Object.entries(markets).map(([k,v])=>'<option value="'+k+'" '+(k===state.market?'selected':'')+'>'+v+'</option>').join('')+'</select></label>':management?'<span style="margin-left:auto">All connected markets</span>':'<span style="margin-left:auto">All connected channels</span>');
        q('[data-nav-title]').textContent=management?'Channel management':'This product';
        q('[data-nav-groups]').innerHTML=(management?manageGroups:productGroups).map(g=>'<section class="nc-group"><h3 class="nc-group-label">'+(g.connected?'<span class="nc-dot" aria-label="Connected"></span>':'')+g.name+'</h3>'+g.items.map(([id,text,ico,count])=>'<a class="nc-nav-link" href="#'+id+'" data-go="'+id+'" '+(state.page===id?'aria-current="page"':'')+'>'+icon(ico)+'<span>'+text+'</span>'+(count?badge(count,'warn'):'')+'</a>').join('')+'</section>').join('');
        q('[data-nav-foot]').innerHTML='<button type="button" class="nc-text-button" data-switch-workspace>'+icon(management?'arrow-left':'settings-2')+' '+(management?'Back to GALE-JACKET':'Channel management')+'</button>';
        q('[data-toggle-nav]').setAttribute('aria-expanded',String(state.navOpen));
        q('[data-nav-scrim]').hidden=!state.navOpen;q('.nc-nav').hidden=!state.navOpen;
        renderContent();icons();
      }
      function icons(){if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});}
      function closeNav(){state.navOpen=false;q('[data-nav-scrim]').hidden=true;q('.nc-nav').hidden=true;q('[data-toggle-nav]').setAttribute('aria-expanded','false');q('[data-toggle-nav]').focus({preventScroll:true});}
      function changeWorkspace(workspace){state.workspace=workspace;state.page=workspace==='product'?'ebay-presentation':'themes';state.libraryEdit=false;render();q('[data-announcement]').textContent=workspace==='product'?'Product workspace':'Channel management';}
      function openReview(){state.review=true;closeNav();q('[data-review-scrim]').hidden=false;q('[data-review-body]').innerHTML='<div>'+badge('Preview only')+'</div><p style="margin-top:12px">GALE-JACKET · '+(state.page.startsWith('amazon')?'Amazon':'eBay')+' · '+markets[state.market]+'</p><div class="nc-diff"><span>Description theme</span>'+label(state)+'</div><div class="nc-diff"><span>Buyer selector order</span>'+state.axes.join(' → ')+'</div><div class="nc-diff"><span>Size order</span>'+sizes().join(' → ')+'</div><p class="nc-muted" style="margin-top:16px">This proposal does not publish changes.</p>';q('[data-close-review]').focus({preventScroll:true});}
      function closeReview(){state.review=false;q('[data-review-scrim]').hidden=true;q('[data-review]').focus({preventScroll:true});}
      root.addEventListener('click',e=>{
        const el=e.target.closest('button,a,[data-nav-scrim]');if(!el)return;
        if(el.matches('[data-go]')){e.preventDefault();state.page=el.dataset.go;state.libraryEdit=false;state.navOpen=false;render();q('[data-announcement]').textContent=titles[state.page];q('[data-toggle-nav]').focus({preventScroll:true});}
        else if(el.matches('[data-toggle-nav]')){state.navOpen=!state.navOpen;render();if(state.navOpen)q('[data-close-nav]').focus({preventScroll:true});}
        else if(el.matches('[data-close-nav],[data-nav-scrim]')){e.preventDefault();e.stopPropagation();closeNav();}
        else if(el.matches('[data-mode]'))changeWorkspace(el.dataset.mode);
        else if(el.matches('[data-switch-workspace]'))changeWorkspace(state.workspace==='product'?'management':'product');
        else if(el.matches('[data-manage-themes]')){state.navOpen=false;changeWorkspace('management');}
        else if(el.matches('[data-edit-theme]')){state.libraryTheme=el.dataset.editTheme;state.libraryEdit=true;renderContent();icons();}
        else if(el.matches('[data-library-back]')){state.libraryEdit=false;renderContent();icons();}
        else if(el.matches('[data-axis]')){const axis=el.dataset.axis;state.axes.reverse();renderContent();icons();q('[data-axis="'+axis+'"]').focus({preventScroll:true});q('[data-announcement]').textContent='Selector order: '+state.axes.join(', ');}
        else if(el.matches('[data-review]'))openReview();
        else if(el.matches('[data-close-review]'))closeReview();
      });
      root.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-workspace]'))changeWorkspace(el.value);else if(el.matches('[data-market]')){state.market=el.value;renderContent();icons();}else if(el.matches('[data-library-theme]')){state.libraryTheme=el.value;renderContent();icons();q('[data-library-theme]')?.focus({preventScroll:true});}else if(el.matches('[data-theme]')){state.theme=el.value;renderContent();icons();q('[data-theme]')?.focus({preventScroll:true});}else if(el.matches('[data-size-order]')){state.sizeOrder=el.value;renderContent();icons();q('[data-size-order]')?.focus({preventScroll:true});}else if(el.matches('[data-product-name]'))state.productName=el.value;});
      root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.review){e.preventDefault();closeReview();}else if(state.navOpen){e.preventDefault();closeNav();}}if(e.key==='Tab'&&(state.review||state.navOpen)){const pane=state.review?q('.nc-modal'):q('.nc-nav');const items=[...pane.querySelectorAll('button:not(:disabled),a[href],select,input')].filter(el=>!el.closest('[hidden]'));const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||!pane.contains(document.activeElement))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||!pane.contains(document.activeElement))){e.preventDefault();first.focus();}}});
      render();
      if(typeof Tweak!=='undefined'){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'density',{label:'Navigation density',options:['Compact','Comfortable']});tweak.addToggle(state,'navOpen',{label:'Show secondary navigation'});}
    })();
  </script>
</div>
