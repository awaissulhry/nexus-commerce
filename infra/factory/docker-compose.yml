# The factory's local stack: PostgreSQL 17 and Redis on their own ports, never Commerce's (5432, 6379; its dev Redis on 6389).
# Both listen on 127.0.0.1 only. One stack per machine, started from a fixed folder outside the worktrees (a copy of
# this file), never from a worktree: a changed copy would recreate the shared database under other sessions.
#
#   docker compose -p nexus-factory -f <stack folder>/docker-compose.yml up -d
#
# Each worktree then creates its own database (factory_<step>); tests create throwaway factory_test… databases.
# Trust authentication is acceptable only because the ports are bound to loopback. No production data ever goes here.
name: nexus-factory

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - factory_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6399:6379'
    volumes:
      - factory_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  factory_postgres:
  factory_redis:
