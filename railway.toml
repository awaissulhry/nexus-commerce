[deploy]
# migrate-direct.mjs runs `prisma migrate deploy` against the NON-POOLER endpoint. Through
# pgbouncer the migrate advisory lock outlives a crashed deploy and wedges every later boot
# — that is the 2026-08-04 outage. See packages/database/scripts/migrate-direct.mjs.
#
# This startCommand OVERRIDES the one in the Railway dashboard, so it is the only one that
# actually runs. Changing package.json's start scripts alone has no effect on production.
startCommand = "cd packages/database && node scripts/migrate-direct.mjs && cd ../.. && node apps/api/dist/index.js"
